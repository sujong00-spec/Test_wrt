<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f8f6">
<title>단어쏙 | 공책으로 공부하는 학원 영어단어</title>
<style>
:root{--ink:#193530;--accent:#087d66;--pale:#e5f5ee;--line:#e0e9e3;--muted:#7c8e86;--red:#bf503b;--bg:#f5f8f6;--shadow:0 12px 45px #173f3010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #a9dfc8;outline-offset:2px}.shell{max-width:1150px;padding:0 22px;margin:auto}
header{position:sticky;top:0;z-index:5;background:#fffffff0;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}header .shell{display:flex;align-items:center;justify-content:space-between;min-height:70px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;letter-spacing:-1px;color:var(--ink);text-decoration:none}.brand span{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:white;font-size:23px}nav{display:flex;gap:4px}nav button{background:none;border:none;border-radius:11px;color:#677d72;font-weight:750;padding:11px 16px}nav button.active{background:var(--pale);color:var(--accent)}
main{padding:35px 0 60px}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.1em;margin:0 0 9px}h1{font-size:clamp(28px,3.3vw,42px);letter-spacing:-1.7px;margin:0 0 9px}h2{font-size:22px;letter-spacing:-.7px;margin:0 0 6px}h3{font-size:17px;margin:0 0 6px}.sub{color:var(--muted);margin:0;line-height:1.65}.intro{margin-bottom:25px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:19px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:21px;padding:24px;box-shadow:var(--shadow);min-width:0}.card+.card{margin-top:17px}.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:11px 16px;min-height:43px;display:inline-flex;justify-content:center;align-items:center;gap:6px;font-weight:800;text-decoration:none}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.soft{background:var(--pale);border-color:var(--pale);color:#06604d}.btn.tiny{min-height:33px;padding:6px 9px;font-size:12px}.btn.danger{color:var(--red);border-color:#f5d6cf}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:var(--pale);color:var(--accent);font-size:12px;font-weight:800;white-space:nowrap}.pill.red{background:#fff0ec;color:#b84934}.field{background:#fbfdfb;border:1px solid #dbe6dd;border-radius:11px;min-height:44px;width:100%;padding:11px 12px;color:var(--ink)}textarea.field{min-height:135px;line-height:1.6;resize:vertical}.label{font-size:13px;font-weight:800;margin:0 0 8px;display:block}.hint{font-size:12px;color:var(--muted);line-height:1.65}.booksel{display:flex;gap:10px;margin-bottom:20px;align-items:center}.booksel select{flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}.stat{background:#f4faf6;padding:14px;border-radius:13px}.stat b{display:block;font-size:25px}.stat small{font-size:12px;color:var(--muted)}.tablewrap{max-height:420px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:420px}th{text-align:left;background:#f8faf9;padding:11px;color:#7a8c83;font-size:12px;border-bottom:1px solid var(--line)}td{padding:7px 9px;border-bottom:1px solid #edf2ee;font-size:14px}td:first-child{color:#94a49a;width:32px}td:last-child{width:34px}td input{width:100%;min-width:0;padding:8px 4px;border:1px solid transparent;border-radius:5px;background:transparent}td input:focus{outline:1px solid #7fc8ad;background:white}.cross{border:0;background:transparent;color:#a1aba5;font-size:23px}.cross:hover{color:var(--red)}.upload{background:#f9fcfa;border:2px dashed #cbded3;border-radius:16px;text-align:center;padding:22px}.upload .symbol{font-size:35px;color:#16876d}.upload input{max-width:100%;font-size:13px}.upload img{display:block;max-width:100%;max-height:150px;margin:12px auto;border-radius:10px}.or{display:flex;align-items:center;gap:12px;color:#9ba9a1;font-size:12px;font-weight:850;margin:21px 0}.or:before,.or:after{content:'';height:1px;background:var(--line);flex:1}.banner{background:linear-gradient(115deg,#108e74,#08654e);border-radius:20px;padding:21px;color:white;margin-top:18px;display:flex;gap:15px;align-items:center;justify-content:space-between}.banner b{display:block;font-size:19px}.banner p{color:#e3f7eb;font-size:13px;margin:5px 0 0}.narrow{max-width:690px;margin:0 auto}.progress{height:9px;border-radius:999px;background:#e9f1eb;overflow:hidden}.progress div{height:100%;background:var(--accent);transition:width .2s}.flip{border:1px solid #c8e4d4;border-radius:20px;background:linear-gradient(145deg,#e4f6ed,#fff);min-height:265px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:20px 0;padding:25px;cursor:pointer}.flip .big,.question{font-size:clamp(31px,6vw,50px);font-weight:900;letter-spacing:-1px;word-break:break-word}.flip .under{color:#6e9b87;font-size:13px;margin-top:18px}.quizcard{padding:33px}.question{text-align:center;margin:42px 0}.answer{width:100%;border:2px solid #d8e7da;border-radius:15px;min-height:61px;text-align:center;padding:12px;font-size:22px}.answer:focus{outline:none;border-color:var(--accent)}.feedback{border-radius:14px;padding:18px;margin:18px 0}.feedback.ok{background:#e8f8ef;color:#186347}.feedback.bad{background:#fff0eb;color:#9c402d}.feedback strong{display:block;font-size:23px;margin-top:6px}.segment{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 25px}.segment button{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;font-weight:850;color:#62756b}.segment button.selected{background:var(--pale);color:#07644f;border:2px solid var(--accent);padding:16px}.choice{display:flex;gap:8px;margin:10px 0 22px;flex-wrap:wrap}.choice label{cursor:pointer}.choice input{position:absolute;opacity:0}.choice span{display:block;border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-weight:800}.choice input:checked+span{background:var(--pale);color:var(--accent);border-color:var(--accent)}.score{font-size:70px;color:var(--accent);font-weight:900;letter-spacing:-3px}.wrong{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid var(--line);background:#fafcfb;border-radius:13px;padding:13px 15px;margin:10px 0}.wrong b{font-size:18px}.wrong small{display:block;color:var(--muted);margin-top:3px}.record{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:7px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90vw;background:#254139;color:white;padding:12px 19px;border-radius:13px;z-index:50;box-shadow:0 10px 25px #0002;text-align:center;font-size:14px}.footer{text-align:center;color:#91a197;font-size:12px;padding:10px 15px 25px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.card{padding:20px}.brand{font-size:21px}nav button{padding:9px 12px;font-size:13px}.grid{grid-template-columns:minmax(0,1fr)}.grid>section{min-width:0}}@media(max-width:470px){.shell{padding:0 13px}.brand{font-size:19px;gap:6px}.brand span{height:32px;width:32px;font-size:19px}nav{gap:0}nav button{padding:9px 8px;font-size:12px}header .shell{min-height:63px}main{padding-top:23px}.card{padding:17px;border-radius:17px}.cardhead{flex-wrap:wrap}.banner{align-items:start;flex-direction:column}.booksel{flex-wrap:wrap}.btn{padding:10px 13px;font-size:13px}.quizcard{padding:20px 17px}.score{font-size:60px}}

.paper-notice{background:var(--pale);border-radius:13px;padding:14px 17px;text-align:center;color:#12644e;font-weight:800;margin-top:25px}
.mark-row{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:16px 0}
.mark-num{width:30px;text-align:center;font-weight:850;color:#7c9487;flex:0 0 30px}
.mark-content{flex:1;min-width:0;word-wrap:break-word}
.mark-prompt{font-size:14px;color:var(--muted);margin-bottom:4px}
.mark-answer{font-size:20px;font-weight:900;color:var(--ink)}
.mark-actions{display:flex;gap:6px;flex-shrink:0}
.mark-btn{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12px;font-weight:850;padding:9px 10px;white-space:nowrap}
.mark-btn.yes.selected{background:#e5f7ed;color:#12734c;border-color:#4baf83}
.mark-btn.no.selected{background:#fff0ed;color:#b44c38;border-color:#e99584}
@media(max-width:520px){.mark-row{gap:8px}.mark-num{width:20px;flex-basis:20px}.mark-answer{font-size:17px}.mark-actions{flex-direction:column}.mark-btn{padding:7px 9px}}
</style>
</head>
<body>
<header><div class="shell"><a href="#" class="brand" id="brand"><span>✦</span>단어쏙</a><nav aria-label="메뉴"><button data-view="home" class="active">단어장</button><button data-view="study">암기</button><button data-view="setup">시험</button><button data-view="history">기록</button></nav></div></header>
<main class="shell" id="app"></main><div class="footer">단어와 시험기록은 이 기기의 브라우저에 저장됩니다. 중요한 단어장은 CSV로 백업하세요.</div>
<script>
'use strict';
const KEY='daneossok-v1';
const SAMPLE=[['apple','사과'],['beautiful','아름다운'],['brave','용감한'],['cloud','구름'],['decide','결정하다'],['enough','충분한'],['forest','숲'],['gather','모으다'],['honest','정직한'],['island','섬'],['journey','여행'],['kind','친절한'],['language','언어'],['mountain','산'],['nature','자연'],['promise','약속'],['remember','기억하다'],['special','특별한'],['weather','날씨'],['yesterday','어제']];
const uid=()=>globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const initial=()=>{const b={id:uid(),name:'샘플 단어장 · 20개',words:SAMPLE.map(([en,ko])=>({id:uid(),en,ko}))};return{books:[b],current:b.id,wrong:{},history:[]}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.books)||!db.books.length)db=initial();db.wrong??={};db.history??=[];if(!db.books.some(b=>b.id===db.current))db.current=db.books[0].id;
let page='home',idx=0,flipped=false,exam=null,result=null,direction='ko-en',num='all',imageFile=null,importText='',busy=false;
const app=document.getElementById('app');const book=()=>db.books.find(x=>x.id===db.current)||db.books[0];const wrong=()=>book().words.filter(w=>db.wrong[w.id]);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('저장에 실패했습니다. 저장공간을 확인하세요.')}};
const toast=s=>{document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)};
const shuffle=a=>{let x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
function title(k,t,d){return `<div class="intro"><p class="eyebrow">${esc(k)}</p><h1>${esc(t)}</h1><p class="sub">${esc(d)}</p></div>`}
function setPage(p){page=p;idx=0;flipped=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===page||((page==='exam'||page==='mark')&&x.dataset.view==='setup')||(page==='result'&&x.dataset.view==='history')));app.innerHTML=({home:home,study:study,setup:setup,exam:examPage,mark:markPage,result:results,history:historyPage}[page]||home)()}
function home(){let b=book(),n=b.words.length;return title('OUR LITTLE WORD LAB','우리 아이 영어단어 시험','학원 단어장을 가져오고, 문제를 보며 공책에 쓰고, 끝나면 정답을 확인하세요.')+`<div class="grid"><section><div class="card">
<div class="cardhead"><div><h2>내 단어장</h2><p class="sub">학원별·주차별로 나눠서 관리해요.</p></div><button class="btn tiny" data-act="newbook">+ 새 단어장</button></div>
<div class="booksel"><select class="field" id="bookselect" aria-label="단어장 선택">${db.books.map(x=>`<option value="${esc(x.id)}" ${x.id===b.id?'selected':''}>${esc(x.name)} (${x.words.length})</option>`).join('')}</select><button class="btn tiny" data-act="rename">이름수정</button><button class="btn tiny danger" data-act="deletebook">삭제</button></div>
<div class="stats"><div class="stat"><b>${n}</b><small>등록 단어</small></div><div class="stat"><b>${wrong().length}</b><small>오답 복습</small></div><div class="stat"><b>${db.history.filter(x=>x.bookId===b.id).length}</b><small>시험 횟수</small></div></div>
<div class="cardhead"><h3>단어 목록</h3><button class="btn tiny" data-act="add">+ 단어 추가</button></div>
${n?`<div class="tablewrap"><table><thead><tr><th>#</th><th>영어</th><th>한글 뜻</th><th></th></tr></thead><tbody>${b.words.map((w,i)=>`<tr><td>${i+1}</td><td><input data-edit="en" data-id="${esc(w.id)}" value="${esc(w.en)}" aria-label="영어단어 ${i+1}"></td><td><input data-edit="ko" data-id="${esc(w.id)}" value="${esc(w.ko)}" aria-label="한글 뜻 ${i+1}"></td><td><button class="cross" data-act="delword" data-id="${esc(w.id)}" aria-label="단어 삭제">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>아직 단어가 없어요.</b>오른쪽에서 사진이나 텍스트를 가져와 주세요.</div>'}
<p class="hint">표를 누르면 영어와 뜻을 수정할 수 있습니다. 여러 정답은 쉼표로 구분하세요.</p></div><div class="banner"><div><b>시험 볼 준비 됐나요?</b><p>공책에 직접 쓰기 · 정답표 대조 · 오답 재시험</p></div><button class="btn" data-view="setup">시험 시작 →</button></div></section>
<section><div class="card"><div class="cardhead"><div><h2>학원 단어장 가져오기</h2><p class="sub">사진 또는 글자를 붙여넣으세요.</p></div><span class="pill">사진 OCR</span></div>
<div class="upload"><div class="symbol">▧</div><b>단어장 사진으로 등록</b><p class="hint">영어와 한글 뜻이 선명하게 보이도록 촬영해 주세요.</p><input id="photo" type="file" accept="image/*" aria-label="단어장 사진 선택"><div id="preview"></div><button style="margin-top:12px" class="btn soft" data-act="ocr" ${busy?'disabled':''}>사진 글자 인식하기</button><p class="hint" id="ocrstatus" role="status"></p></div>
<div class="or">또는 직접 붙여넣기</div><label class="label" for="import">영어단어 + 한글 뜻 (한 줄에 하나씩)</label><textarea class="field" id="import" placeholder="apple 사과&#10;beautiful 아름다운&#10;look after 돌보다&#10;journey, 여행">${esc(importText)}</textarea><p class="hint">엑셀의 2개 열을 복사해 붙여넣어도 됩니다. 사진 인식 결과는 꼭 확인하세요.</p><div class="actions"><button class="btn primary" data-act="import">단어 추가하기</button><button class="btn" data-act="clear">지우기</button></div></div></section></div>`}
function study(){const words=book().words.filter(w=>w.en.trim()&&w.ko.trim());if(!words.length)return title('STUDY','암기 카드','먼저 단어장에 단어를 넣어 주세요.')+'<button class="btn primary" data-view="home">단어장 가기</button>';idx=Math.min(idx,words.length-1);let w=words[idx];return title('FLIP & LEARN','카드를 뒤집으며 암기하기','카드를 눌러 뜻을 확인하고 영어 발음도 들어보세요.')+`<div class="narrow"><div class="card"><div class="cardhead"><span class="pill">${esc(book().name)}</span><b>${idx+1} / ${words.length}</b></div><div class="progress"><div style="width:${100*(idx+1)/words.length}%"></div></div><div class="flip" role="button" tabindex="0" data-act="flip"><span class="eyebrow">${flipped?'한글 뜻':'영어 단어'}</span><span class="big">${esc(flipped?w.ko:w.en)}</span><span class="under">눌러서 카드 뒤집기</span></div><div class="actions" style="justify-content:center;margin-bottom:22px"><button class="btn soft" data-act="speak">◖)) 발음 듣기</button><button class="btn" data-act="flip">카드 뒤집기</button></div><div class="actions" style="justify-content:space-between"><button class="btn" data-act="prev" ${idx===0?'disabled':''}>← 이전</button><button class="btn primary" data-act="next" ${idx===words.length-1?'disabled':''}>다음 →</button></div></div></div>`}
function setup(){let n=book().words.filter(w=>w.en.trim()&&w.ko.trim()).length;return title('READY, SET, GO!','영어단어 시험','패드에는 문제만 표시됩니다. 정답은 공책에 직접 쓰세요.')+`<div class="narrow"><div class="card"><div class="cardhead"><h2>시험 설정</h2><span class="pill">${esc(book().name)}</span></div><label class="label">문제 방향</label><div class="segment"><button data-dir="ko-en" class="${direction==='ko-en'?'selected':''}">한글 → 영어<small class="hint" style="display:block;margin-top:6px">공책에 철자 쓰기</small></button><button data-dir="en-ko" class="${direction==='en-ko'?'selected':''}">영어 → 한글<small class="hint" style="display:block;margin-top:6px">공책에 뜻 쓰기</small></button></div><label class="label">문제 수</label><div class="choice">${['10','20','all'].map(x=>`<label><input type="radio" name="count" value="${x}" ${num===x?'checked':''}><span>${x==='all'?'전체':x+'개'}</span></label>`).join('')}</div><p class="hint">현재 ${n}단어. 단어 수가 적으면 등록된 단어만 출제됩니다.</p><div class="actions" style="margin-top:22px"><button class="btn primary" data-act="start" ${n?'':'disabled'}>공책 시험 시작 →</button><button class="btn soft" data-act="startwrong" ${wrong().length?'':'disabled'}>오답만 재시험 (${wrong().length})</button></div></div></div>`}
function examPage(){
 if(!exam)return setup();
 const w=exam.words[exam.i],question=exam.dir==='ko-en'?w.ko:w.en;
 return title('NOTEBOOK TEST',`문제 ${exam.i+1} / ${exam.words.length}`,'패드에는 문제만 보여줍니다. 정답은 공책에 번호와 함께 적으세요.')+`<div class="narrow"><div class="card quizcard">
 <div class="progress"><div style="width:${100*(exam.i+1)/exam.words.length}%"></div></div>
 <div class="paper-notice">✎ 공책에 <strong>${exam.i+1}번</strong> 정답을 적으세요</div>
 <p class="eyebrow" style="text-align:center;margin:28px 0 0">${exam.dir==='ko-en'?'다음 뜻을 영어로 쓰세요':'다음 단어의 한글 뜻을 쓰세요'}</p>
 <div class="question">${esc(question)}</div>
 <p class="hint" style="text-align:center">지금은 정답이 공개되지 않습니다. 모두 작성한 뒤 함께 채점해요.</p>
 <div class="actions" style="justify-content:space-between;margin-top:28px"><button class="btn" data-act="backquestion" ${exam.i===0?'disabled':''}>← 이전 문제</button><button class="btn primary" data-act="advance">${exam.i===exam.words.length-1?'모두 썼어요 · 채점하기 →':'공책에 썼어요 · 다음 →'}</button></div>
 </div><p class="hint" style="text-align:center;margin-top:13px">문제 번호는 공책과 동일하게 적어주세요. 답안을 작성할 때 키보드는 필요하지 않습니다.</p></div>`;
}
function markPage(){
 if(!exam)return setup();
 const marked=exam.marks.filter(x=>x!==null).length;
 return title('CHECK YOUR NOTEBOOK','공책 답안 채점하기', '공책과 정답을 하나씩 비교하고 맞음·틀림을 표시해 주세요.')+`<div class="narrow"><div class="card"><div class="cardhead"><div><h2>정답표</h2><p class="sub">여기서 처음으로 정답을 공개합니다.</p></div><span class="pill">채점 ${marked} / ${exam.words.length}</span></div>
 <div class="progress" style="margin-bottom:18px"><div style="width:${100*marked/exam.words.length}%"></div></div>
 ${exam.words.map((w,i)=>`<div class="mark-row"><div class="mark-num">${i+1}</div><div class="mark-content"><div class="mark-prompt">${esc(exam.dir==='ko-en'?w.ko:w.en)}</div><div class="mark-answer">${esc(exam.dir==='ko-en'?w.en:w.ko)}</div></div><div class="mark-actions"><button class="mark-btn yes ${exam.marks[i]===true?'selected':''}" data-mark="ok" data-i="${i}" aria-pressed="${exam.marks[i]===true}">✓ 맞음</button><button class="mark-btn no ${exam.marks[i]===false?'selected':''}" data-mark="no" data-i="${i}" aria-pressed="${exam.marks[i]===false}">✕ 틀림</button></div></div>`).join('')}
 <p class="hint" style="margin-top:17px">아직 채점하지 않은 문제는 점수 계산에 포함하지 않습니다. 전부 표시해야 결과를 저장할 수 있어요.</p>
 <div class="actions" style="justify-content:space-between;margin-top:18px"><button class="btn" data-act="backtoexam">← 문제 다시 보기</button><button class="btn primary" data-act="finishmark" ${marked===exam.words.length?'':'disabled'}>채점 완료 · 결과 보기 →</button></div>
 </div></div>`;
}
function results(){if(!result)return historyPage();let r=result,score=Math.round(100*r.correct/r.total),miss=r.entries.filter(x=>!x.ok);return title('GREAT WORK','시험 결과','공책을 직접 대조해 채점한 결과예요. 틀린 단어는 다시 연습해 보세요.')+`<div class="narrow"><div class="card" style="text-align:center"><p class="eyebrow">MY SCORE</p><div class="score">${score}<small style="font-size:24px">점</small></div><p class="sub">총 ${r.total}문제 · ${r.correct}개 정답</p><div class="progress" style="margin:23px 0"><div style="width:${score}%"></div></div><div class="actions" style="justify-content:center"><button class="btn primary" data-act="startwrong" ${wrong().length?'':'disabled'}>오답 재시험 (${wrong().length})</button><button class="btn" data-view="setup">다시 시험 보기</button></div></div><div class="card"><div class="cardhead"><h2>이번 시험 오답 ${miss.length}개</h2><span class="pill ${miss.length?'red':''}">${miss.length?'복습 추천':'모두 정답!'}</span></div>${miss.length?miss.map(x=>`<div class="wrong"><div><b>${esc(x.word.en)} <button class="btn tiny" data-act="pronounce" data-word="${esc(x.word.en)}" aria-label="발음 듣기">◖))</button></b><small>${esc(x.word.ko)}</small></div><span class="pill red">오답</span></div>`).join(''):'<div class="empty"><b>완벽해요!</b>틀린 단어가 하나도 없어요.</div>'}</div></div>`}
function historyPage(){return title('MY PROGRESS','시험 기록','공책 답안을 직접 채점한 결과가 현재 브라우저에 저장됩니다.')+`<div class="narrow"><div class="card"><div class="cardhead"><h2>최근 응시 내역</h2><span class="pill">${db.history.length}회</span></div>${db.history.length?db.history.slice(0,40).map(r=>`<div class="record"><div><b>${esc(r.bookName)}</b><p class="hint" style="margin:5px 0 0">${new Date(r.date).toLocaleString('ko-KR')} · ${r.total}문제 · ${r.dir==='ko-en'?'철자':'뜻'} 시험</p></div><div style="text-align:right"><b style="font-size:23px;color:var(--accent)">${Math.round(100*r.correct/r.total)}점</b><p class="hint" style="margin:3px 0">${r.correct}/${r.total} 정답</p></div></div>`).join(''):'<div class="empty"><b>첫 시험을 시작해 보세요!</b><button class="btn primary" data-view="setup" style="margin-top:14px">시험 보기</button></div>'}</div><div class="card"><h3>단어장 백업</h3><p class="sub" style="margin-bottom:16px">현재 선택한 단어장을 CSV 파일로 다운로드할 수 있습니다.</p><button class="btn soft" data-act="export">CSV 다운로드</button></div></div>`}
function parseWords(input){const lines=String(input).split(/\r?\n/).map(s=>s.replace(/^[\s•●]*(?:\(?\d+[.)]\s*)?/, '').trim()).filter(Boolean);let output=[],single=[];
for(let line of lines){if(/^(?:영어|단어|뜻|meaning|word|번호)\s*[,\t|]?(?:뜻|meaning)?$/i.test(line))continue;let en='',ko='';const parts=line.split(/\t|\s{2,}|\s*[,;|:=]\s*/).map(s=>s.trim()).filter(Boolean);if(parts.length>=2){let a=parts.find(x=>/[a-zA-Z]/.test(x)&&!/[가-힣]/.test(x)),b=parts.find(x=>/[가-힣]/.test(x));if(a&&b){en=a;ko=b}}
if(!en||!ko){let h=line.search(/[가-힣]/);if(h>0){en=line.slice(0,h).replace(/[-—–,:;=|\s]+$/,'').trim();ko=line.slice(h).trim()}else if(h===0){let e=line.search(/[a-zA-Z]/);if(e>0){ko=line.slice(0,e).replace(/[-—–,:;=|\s]+$/,'').trim();en=line.slice(e).trim()}}}
en=en.replace(/^\d+[.)]?\s*/,'').replace(/^[-—–,:;=|\s]+|[-—–,:;=|\s]+$/g,'');ko=ko.replace(/^[-—–,:;=|\s]+|[-—–,:;=|\s]+$/g,'');if(en&&ko&&/[a-zA-Z]/.test(en)&&/[가-힣]/.test(ko)&&en.length<90&&ko.length<150)output.push({id:uid(),en,ko});else single.push(line)}
for(let i=0;i<single.length-1;i++){let a=single[i],b=single[i+1];if(/^[a-zA-Z][a-zA-Z '-]*$/.test(a)&&/^[가-힣\s(),/]+$/.test(b)){output.push({id:uid(),en:a,ko:b});i++}else if(/^[가-힣\s(),/]+$/.test(a)&&/^[a-zA-Z][a-zA-Z '-]*$/.test(b)){output.push({id:uid(),en:b,ko:a});i++}}
return output.filter((w,i,a)=>a.findIndex(y=>y.en.toLowerCase()===w.en.toLowerCase()&&y.ko===w.ko)===i).slice(0,250)}
const enNorm=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');const koNorm=s=>String(s).toLowerCase().trim().replace(/\s+/g,'').replace(/[.!?]+$/,'');
function check(value,w,dir){let norm=dir==='ko-en'?enNorm:koNorm;let expect=dir==='ko-en'?w.en:w.ko;return expect.split(/\s*[,;/]\s*/).map(norm).includes(norm(value))}
function start(onlyWrong){let words=book().words.filter(w=>w.en.trim()&&w.ko.trim());if(onlyWrong)words=words.filter(w=>db.wrong[w.id]);if(!words.length){toast('시험 볼 단어가 없습니다.');return}words=shuffle(words).slice(0,num==='all'?words.length:Number(num));exam={words,i:0,marks:Array(words.length).fill(null),dir:direction,bookId:book().id,bookName:book().name};setPage('exam')}
function finish(){if(!exam||exam.marks.some(x=>x===null)){toast('모든 문제를 맞음 또는 틀림으로 표시해주세요.');return}const entries=exam.words.map((word,i)=>({word,ok:exam.marks[i]}));for(const x of entries){if(x.ok)delete db.wrong[x.word.id];else db.wrong[x.word.id]=true}const r={date:new Date().toISOString(),bookId:exam.bookId,bookName:exam.bookName,dir:exam.dir,total:entries.length,correct:entries.filter(x=>x.ok).length};db.history.unshift(r);db.history=db.history.slice(0,100);save();result={...r,entries};exam=null;setPage('result')}
function speak(word){if(!('speechSynthesis' in window)){toast('이 브라우저는 발음 재생을 지원하지 않습니다.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
async function resize(file){return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{try{let ratio=Math.min(1,1800/Math.max(image.width,image.height));let canvas=document.createElement('canvas');canvas.width=Math.round(image.width*ratio);canvas.height=Math.round(image.height*ratio);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};image.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지를 읽을 수 없습니다.'))};image.src=url})}
async function doOCR(){if(busy)return;if(!imageFile){toast('사진을 먼저 선택해 주세요.');return}busy=true;let btn=document.querySelector('[data-act="ocr"]'),msg=document.getElementById('ocrstatus'),worker;btn.disabled=true;btn.textContent='인식 중...';const show=s=>{if(msg)msg.textContent=s};
try{show('인식 엔진 다운로드 중... 인터넷 연결이 필요합니다.');if(!window.Tesseract)await new Promise((res,rej)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.onload=res;script.onerror=()=>rej(Error('인식 엔진을 불러올 수 없습니다.'));document.head.appendChild(script)});worker=await Tesseract.createWorker('eng+kor',1,{logger:m=>{if(m.status==='recognizing text')show('글자 읽는 중 '+Math.round((m.progress||0)*100)+'%')}});const r=await worker.recognize(await resize(imageFile));let text=(r.data?.text||'').trim();if(!text)throw Error('인식된 글자가 없습니다. 더 선명한 사진을 선택하세요.');importText=text;let area=document.getElementById('import');area.value=text;show('글자 인식 완료! '+parseWords(text).length+'개 단어 후보를 찾았습니다. 인식 결과를 수정하고 추가하기를 누르세요.');area.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){show('인식에 실패했습니다: '+e.message+' · 직접 붙여넣기를 이용할 수 있습니다.')}finally{try{await worker?.terminate()}catch(e){}busy=false;btn.disabled=false;btn.textContent='사진 글자 인식하기'}}
function exportCSV(){let rows=[['영어','뜻'],...book().words.map(w=>[w.en,w.ko])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=book().name.replace(/[\\/:*?"<>|]/g,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',event=>{if(event.target.closest('#brand')){event.preventDefault();setPage('home');return}let nav=event.target.closest('[data-view]');if(nav){setPage(nav.dataset.view);return}let dir=event.target.closest('[data-dir]');if(dir){direction=dir.dataset.dir;render();return}let el=event.target.closest('[data-act]');if(!el)return;const b=book(),act=el.dataset.act;
switch(act){case'newbook':{let name=prompt('새 단어장 이름을 입력해 주세요. (예: 학원 11월 2주차)','새 단어장');if(!name?.trim())return;let x={id:uid(),name:name.trim().slice(0,60),words:[]};db.books.unshift(x);db.current=x.id;save();render();break}case'rename':{let name=prompt('단어장 이름 수정',b.name);if(name?.trim()){b.name=name.trim().slice(0,60);save();render()}break}case'deletebook':if(confirm('이 단어장을 삭제할까요? 해당 단어와 오답 목록이 삭제됩니다.')){b.words.forEach(w=>delete db.wrong[w.id]);db.books=db.books.filter(x=>x.id!==b.id);if(!db.books.length)db.books.push({id:uid(),name:'새 단어장',words:[]});db.current=db.books[0].id;save();render()}break;
case'add':{let w={id:uid(),en:'',ko:''};b.words.push(w);save();render();document.querySelector('[data-edit="en"][data-id="'+w.id+'"]')?.focus();break}case'delword':b.words=b.words.filter(w=>w.id!==el.dataset.id);delete db.wrong[el.dataset.id];save();render();break;
case'import':{let list=parseWords(document.getElementById('import').value);if(!list.length){toast('영어 + 한글 뜻 쌍을 찾지 못했어요. 예: apple 사과');return}let old=new Set(b.words.map(w=>enNorm(w.en)+'::'+koNorm(w.ko))),newlist=list.filter(w=>!old.has(enNorm(w.en)+'::'+koNorm(w.ko)));b.words.push(...newlist);importText='';save();render();toast(newlist.length+'개 단어를 추가했습니다. 목록에서 오탈자를 확인해 주세요.');break}
case'clear':importText='';document.getElementById('import').value='';break;case'ocr':doOCR();break;
case'flip':flipped=!flipped;render();break;case'prev':idx=Math.max(0,idx-1);flipped=false;render();break;case'next':idx=Math.min(b.words.filter(w=>w.en.trim()&&w.ko.trim()).length-1,idx+1);flipped=false;render();break;case'speak':{let w=b.words.filter(w=>w.en.trim()&&w.ko.trim())[idx];if(w)speak(w.en);break}case'pronounce':speak(el.dataset.word);break;
case'start':start(false);break;case'startwrong':start(true);break;case'advance':if(exam.i+1===exam.words.length)setPage('mark');else{exam.i++;render()}break;case'backquestion':exam.i=Math.max(0,exam.i-1);render();break;case'backtoexam':setPage('exam');break;case'finishmark':finish();break;case'export':exportCSV();break;
}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='bookselect'){db.current=t.value;save();idx=0;render()}if(t.id==='photo'){imageFile=t.files?.[0]||null;let target=document.getElementById('preview');target.replaceChildren();if(imageFile){let img=document.createElement('img'),url=URL.createObjectURL(imageFile);img.src=url;img.alt='선택한 단어장 미리보기';img.onload=()=>URL.revokeObjectURL(url);target.appendChild(img)}}if(t.dataset.edit){let w=book().words.find(x=>x.id===t.dataset.id);if(w){w[t.dataset.edit]=t.value.trim();save()}}if(t.name==='count')num=t.value});
document.addEventListener('input',e=>{if(e.target.id==='import')importText=e.target.value});
document.addEventListener('click',e=>{const m=e.target.closest('[data-mark]');if(!m||!exam)return;const i=Number(m.dataset.i);if(!Number.isInteger(i)||i<0||i>=exam.marks.length)return;exam.marks[i]=m.dataset.mark==='ok';render()});
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.classList.contains('flip')){e.preventDefault();flipped=!flipped;render()}});
render();
</script>
